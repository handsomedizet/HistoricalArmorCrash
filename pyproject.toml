[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-impact-lsdyna"
version = "0.3.0"
description = "Low-cost LS-DYNA armor-to-torso impact screening pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
armor-impact = "armor_impact.cli:main"

[tool.setuptools.packages.find]
include = ["armor_impact*"]

[tool.setuptools.package-data]
armor_impact = ["*.toml"]
