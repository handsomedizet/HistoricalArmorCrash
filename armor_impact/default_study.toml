[solver]
executable = ""
ncpus = 2
memory_mb = 2048
timeout_minutes = 120

[study]
armor_types = ["plate"]
caliber_mm = [80.0]
speed_mps = [150.0]
yaw_deg = [0.0]
pitch_deg = [0.0]
impact_x_mm = [0.0]
impact_z_mm = [0.0]
mesh_scale = [1.0]

[mesh]
body_nx = 24
body_ny = 8
body_nz = 32
projectile_subdivisions = 2

[body]
width_mm = 360.0
depth_mm = 200.0
height_mm = 500.0
density_kg_m3 = 1000.0
bulk_modulus_mpa = 2200.0
shear_short_mpa = 10.0
shear_long_mpa = 3.0
decay_per_ms = 0.5

[armor.geometry]
# Physical clearance between the torso and the torso-facing shell surface.
gap_mm = 1.0
cross_section = "elliptical"

[armor.plate]
construction = "continuous_plate"
wrap_mode = "front_half"
thickness_mm = 2.0
density_kg_m3 = 7850.0
youngs_modulus_gpa = 200.0
poisson = 0.30
yield_mpa = 350.0
tangent_modulus_mpa = 1000.0
failure_strain = 0.12

[armor.dujeong_equivalent]
construction = "riveted_discrete_plates"
wrap_mode = "full_wrap"
plate_width_mm = 60.0
plate_height_mm = 60.0
plate_gap_mm = 15.0
# Effective quilted textile section between the internal iron plates.
thickness_mm = 2.0
density_kg_m3 = 900.0
youngs_modulus_gpa = 0.5
poisson = 0.30
yield_mpa = 10.0
tangent_modulus_mpa = 20.0
failure_strain = 0.40

[armor.dujeong_equivalent.reinforcement]
# Screening assumption for the riveted carburized/low-carbon iron pieces.
thickness_mm = 1.2
density_kg_m3 = 7850.0
youngs_modulus_gpa = 200.0
poisson = 0.30
yield_mpa = 250.0
tangent_modulus_mpa = 500.0
failure_strain = 0.12

[projectile]
density_kg_m3 = 7200.0
youngs_modulus_gpa = 120.0
poisson = 0.25
standoff_mm = 40.0

[output]
history_dt_ms = 0.01
d3plot_dt_ms = 0.05
termination_ms = 30.0
